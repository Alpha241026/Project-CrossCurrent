<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CrossCurrent — API Workspace</title>

        <meta name="google-site-verification" content="UITph0H9qecrgidUGbVriU_g9JrLJfh-nL_h_sqFK2M" />
        
        <meta
            name="description"
            content="A lightweight API workspace for organizing, executing, and inspecting HTTP requests."
        >

        <meta property="og:title" content="CrossCurrent — API Workspace">
        <meta
            property="og:description"
            content="A lightweight API workspace for organizing, executing, and inspecting HTTP requests."
        >
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://crosscurrent-mz20.onrender.com/assets/crosscurrent-final.svg">

        <meta name="theme-color" content="#091014">

        <link rel="icon" type="image/svg+xml" href="assets/crosscurrent-final.svg">

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <div class="sidebar">
            <div id="title">
                <h1>CrossCurrent</h1>
            </div>
            
            <h2>Projects</h2>
            
            <ul id="project-list">
            </ul> 
            
            <div class="create-pro">
                <input id="pro-input" type="text" name="ProName" placeholder="Enter project name...">

                <textarea
                id="pro-description-input"
                placeholder="Project description..."></textarea>
                
                <button id="pro-button" type="button">Create project</button>
            </div>
        </div>

        <div class="main">
            <div class="workspace">
                <div class="request-builder">
                    <div class="request-top">
                        <div class="method-section">
                            <label for="method">Method</label>
                            <select id="method">
                                <option>GET</option>
                                <option>POST</option>
                                <option>PATCH</option>
                                <option>DELETE</option>
                            </select>
                        </div>

                        <div class="url-section">
                            <label for="url">URL</label>
                            <input
                                type="text"
                                id="url"
                                placeholder="https://api.example.com/users">
                        </div>

                        <div class="endpoint-name-section">
                            <label for="endpoint-name">Endpoint Name</label>
                            <input
                                type="text"
                                id="endpoint-name"
                                placeholder="Endpoint name..."
                            >
                        </div>

                        <div class="save-section">
                            <button id="save-endpoint-btn" type="button">
                                Save
                            </button>
                        </div>

                        <div class="send-section">
                            <button id="send-btn" type="button">
                                Send
                            </button>
                        </div>

                    </div>

                    <div class="endpoint-description-section">
                        <label for="endpoint-description">Endpoint Description</label>
                        <textarea
                        id="endpoint-description"
                        placeholder="Describe what this endpoint is used for..."></textarea>
                    </div>

                    <div class="params-section">
                        <h3>Params</h3>
                        <div id="params-container">
                        </div>
                        <button id="add-param-btn" type="button">Add Param</button>
                    </div>

                    <div class="headers-section">
                        <h3>Headers</h3>
                        <div id="headers-container">
                        </div>
                        <button id="add-headers-btn" type="button">Add Headers</button>
                    </div>

                    <div class="body-section">
                        <h3>Body</h3>
                        <textarea
                        id="request-body"
                        placeholder='{"name":"John"}'></textarea>
                    </div>
                </div>

                <div class="response-viewer">
                    <div class="status-section">
                        <h3>Status</h3>
                        <p id="status-output">---</p>
                    </div>

                    <div class="json-section">
                        <h3>Response</h3>
                        <pre id="response-output">No response yet...</pre>
                    </div>
                </div>

                <!-- execution history for the selected endpoint -->
                <section class="history-panel">

                    <div class="history-header">
                        <h3>History</h3>
                        <button id="refresh-history-btn">Refresh</button>
                    </div>

                    <div id="history-list" class="history-list">
                        <p class="history-empty">No execution history yet</p>
                    </div>

                </section>
            </div>
        </div>

        <script src="js/main.js"></script>
    </body>
</html>
