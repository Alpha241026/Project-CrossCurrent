<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Chimera</title>
    </head>

    <body>

        <div class="sidebar">
            <div id="title">
                <h1>Chimera</h1>
            </div>
            
            <h2>Projects</h2>
            
            <ul id="project-list">
            </ul>   
            
            <div class="create-pro">
                <input id="pro-input" type="text" name="ProName" placeholder="Enter project name...">
                
                <button id="pro-button" type="button">Create project</button>
            </div>
        </div>

        <div class="main">
            <h2>Welcome to Chimera !</h2>
            <p>Select or create a project...</p>
        </div>

        <script src="js/main.js"></script>
    </body>
</html>
